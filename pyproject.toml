[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "effect-generation-agent"
version = "0.1.0"
description = "Agent for planning effect-generation workflows from reference videos."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
effect-agent = "effect_generation_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

